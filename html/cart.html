<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — La Vie en Fleurs</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body class="page">
    <header class="header"></header>

    <main class="cart-page">
        <div class="container">
            <h1 class="cart-page__title">Корзина и оформление заказа</h1>

            <div class="cart-layout">
                <!-- Левая колонка - список товаров -->
                <div class="cart-items">
                    <div id="cart-content" class="cart-content"></div>
                </div>

                <!-- Правая колонка - форма заказа -->
                <div class="cart-summary">
                    <div id="cart-total-block" style="display: none;">
                        <div class="cart-total">
                            <span>Итого:</span>
                            <span id="total-sum">0</span> ₽
                        </div>
                    </div>

                    <form id="order-form" class="order-form">
                        <h3>Данные для заказа</h3>
                        <div class="form-group">
                            <label>Ваше имя *</label>
                            <input type="text" id="custName" required placeholder="Иван Иванов">
                        </div>
                        <div class="form-group">
                            <label>Телефон *</label>
                            <input type="tel" id="custPhone" required placeholder="+7 (999) 000-00-00">
                        </div>
                        <div class="form-group">
                            <label>Адрес доставки *</label>
                            <input type="text" id="custAddress" required placeholder="Улица, дом, квартира">
                        </div>
                        <div class="form-group">
                            <label>Дата и время доставки</label>
                            <input type="text" id="deliveryTime" placeholder="Например: завтра к 12:00">
                        </div>
                        <div class="form-group">
                            <label>Комментарий к заказу</label>
                            <textarea id="custComment" rows="2" placeholder="Текст записки или пожелания"></textarea>
                        </div>
                        <button type="submit" class="btn btn-order-submit">Оформить заказ</button>
                    </form>
                </div>
            </div>
        </div>    
    </main>

    <footer class="footer"></footer>

    <script src="../js/data.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
