<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — La Vie en Fleurs</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body class="page">

    <header class="header"></header>

    <main class="catalog-page">
        <div class="container catalog-page__inner">
            <header class="catalog-header">
                <h1 class="catalog-header__title">Каталог цветов</h1>
                <p class="catalog-header__subtitle">Выберите свой идеальный букет</p>
            </header>

            <div class="catalog-layout">
                <aside class="filters">
                    <div class="filters__group">
                        <h4 class="filters__title">Категории</h4>
                        <ul class="filters__list">
                            <li class="filters__item">
                                <label><input type="checkbox" class="filter-category" value="Розы"> Розы</label>
                            </li>
                            <li class="filters__item">
                                <label><input type="checkbox" class="filter-category" value="Авторские"> Авторские</label>
                            </li>
                            <li class="filters__item">
                                <label><input type="checkbox" class="filter-category" value="Миксы"> Миксы</label>
                            </li>
                            <li class="filters__item">
                                <label><input type="checkbox" class="filter-category" value="Пионы"> Пионы</label>
                            </li>
                        </ul>
                    </div>

                    <div class="filters__group">
                        <h4 class="filters__title">Цена до: <span id="priceValue">6000 ₽</span></h4>
                        <input type="range" id="priceRange" min="1000" max="6000" step="100" value="6000" class="filters__range">
                    </div>

                    <div class="filters__actions">
                        <button type="button" id="applyFilters" class="filters__btn-apply">Применить</button>
                        <button type="button" id="resetFilters" class="filters__btn-reset">Сбросить</button>
                    </div>
                </aside>

                <section id="catalog-grid" class="catalog-grid"></section>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="../js/data.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/catalog.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
